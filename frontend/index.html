<!DOCTYPE html>
<html>
<head>
  <title>ScholarSearch</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { text-align: center; }
    #searchBar { display: flex; gap: 10px; margin-bottom: 30px; }
    #q { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .paper { border-bottom: 1px solid #ddd; padding: 15px 0; }
    .paper h3 { margin: 0 0 5px 0; }
    .paper p { margin: 5px 0; color: #555; }
    .paper a { color: #0645AD; }
  </style>
</head>
<body>
  <h1>ScholarSearch</h1>
  <div id="searchBar">
    <input id="q" placeholder="Search ML papers..." onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()">Search</button>
  </div>
  <div id="results"></div>

  <script>
    const API_URL = "http://localhost:8001";

    async function search() {
      const q = document.getElementById('q').value;
      if (!q.trim()) return;

      document.getElementById('results').innerHTML = "Searching...";

      const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}&top_k=10`);
      const data = await res.json();

      document.getElementById('results').innerHTML = data.map(p => `
        <div class="paper">
          <h3>${p.title}</h3>
          <p>${p.authors.join(', ')}</p>
          <a href="${p.link}" target="_blank">arXiv link</a>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
